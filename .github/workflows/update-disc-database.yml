name: Update Disc Database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest database
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            "https://my-disc-bag.ryoichi094.chatgpt.site/api/discs/export?format=json" \
            --output export-new.json

      - name: Validate JSON
        run: |
          jq -e '
            (.rowCount | type == "number") and
            (.records | type == "array") and
            (.rowCount == (.records | length))
          ' export-new.json > /dev/null

      - name: Replace database if changed
        id: update
        run: |
          if cmp -s export.json export-new.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes found."
          else
            mv export-new.json export.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Database updated."
          fi

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export.json
          git commit -m "Update disc database"
          git push
